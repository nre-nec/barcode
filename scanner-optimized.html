<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>قارئ الباركود و QR الذكي</title>

  <!-- ZXing library for fallback & wide compatibility -->
  <script defer src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --surface-card: #131926;
      --surface-card-hover: #1b2336;
      --border-color: #242f49;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.4);
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      padding-bottom: 36px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }

    .header-title-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .engine-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.18);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.3);
      width: fit-content;
    }

    .engine-badge.native {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .engine-badge.zxing {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    .status-dot.active-scan {
      animation: pulseDot 1s infinite alternate;
    }

    @keyframes pulseDot {
      from { transform: scale(0.8); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* Mode Switcher Tabs */
    .mode-switch-wrapper {
      display: flex;
      background: #0f1523;
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* Warning Banner */
    .warning-box {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.85rem;
      text-align: center;
    }

    /* Camera Viewport */
    .camera-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    video#cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }

    /* Overlay Guide */
    .overlay-mask {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mask-top, .mask-bottom {
      width: 100%;
      background: rgba(5, 7, 13, 0.65);
      flex: 1;
      transition: flex 0.25s ease;
    }

    .mask-middle-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.25s ease;
    }

    /* Dynamic Reticle Sizing */
    .mode-1d .mask-middle-row {
      height: 34%;
    }
    .mode-qr .mask-middle-row {
      height: 66%;
    }

    .mask-left, .mask-right {
      flex: 1;
      height: 100%;
      background: rgba(5, 7, 13, 0.65);
      transition: flex 0.25s ease;
    }

    .scan-reticle {
      position: relative;
      box-sizing: border-box;
      border: 1.5px dashed rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .mode-1d .scan-reticle {
      width: 88%;
      height: 100%;
    }

    .mode-qr .scan-reticle {
      width: auto;
      aspect-ratio: 1 / 1;
      height: 100%;
    }

    .scan-reticle.success-flash {
      border-color: var(--accent-green) !important;
      box-shadow: 0 0 30px var(--accent-green-glow);
    }

    /* Corners for barcode frame */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #38bdf8;
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 0; right: 0; border-width: 3.5px 3.5px 0 0; border-top-right-radius: 8px; }
    .corner-tr { top: 0; left: 0; border-width: 3.5px 0 0 3.5px; border-top-left-radius: 8px; }
    .corner-bl { bottom: 0; right: 0; border-width: 0 3.5px 3.5px 0; border-bottom-right-radius: 8px; }
    .corner-br { bottom: 0; left: 0; border-width: 0 0 3.5px 3.5px; border-bottom-left-radius: 8px; }

    /* Laser Line Animation */
    .laser-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, #ef4444 30%, #f87171 50%, #ef4444 70%, transparent);
      box-shadow: 0 0 12px #ef4444, 0 0 4px #fff;
      animation: scanSweep 1.8s ease-in-out infinite alternate;
    }

    .mode-qr .laser-line {
      background: linear-gradient(90deg, transparent, #06b6d4 30%, #67e8f9 50%, #06b6d4 70%, transparent);
      box-shadow: 0 0 12px #06b6d4, 0 0 4px #fff;
    }

    @keyframes scanSweep {
      0% { top: 4%; opacity: 0.85; }
      50% { opacity: 1; }
      100% { top: 92%; opacity: 0.85; }
    }

    .scan-hint {
      position: absolute;
      bottom: 8px;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: 999px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      max-width: 90%;
    }

    /* Controls Panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }

    .action-buttons-row {
      display: flex;
      gap: 8px;
      justify-content: stretch;
    }

    button.btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    button.btn-primary {
      background-color: var(--primary);
      color: #fff;
    }
    button.btn-primary:active {
      background-color: var(--primary-hover);
      transform: translateY(1px);
    }

    button.btn-stop {
      background-color: #27272a;
      color: #f87171;
      border-color: #3f3f46;
    }
    button.btn-stop:active {
      background-color: #1f1f23;
    }

    button.btn-torch {
      background-color: #1e293b;
      color: #f3f4f6;
      border-color: #334155;
    }
    button.btn-torch.active {
      background-color: #b45309;
      color: #fef08a;
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    button.btn-upload {
      background-color: #1e293b;
      color: #93c5fd;
      border-color: #334155;
    }
    button.btn-upload:active {
      background-color: #334155;
    }

    /* Zoom Quick Control Row */
    .zoom-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .zoom-title-area {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 75px;
    }

    .zoom-chips {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: flex-end;
    }

    .zoom-chip-btn {
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.15s;
    }
    .zoom-chip-btn.active {
      background: var(--accent-cyan);
      color: #042f2e;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
    }

    .zoom-cycle-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-family: inherit;
    }
    .zoom-cycle-btn:active {
      background: #334155;
    }

    /* Current Result Card */
    .result-card {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .format-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
      font-family: monospace;
    }

    .barcode-display-box {
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: var(--radius-sm);
      padding: 14px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 220px;
      overflow-y: auto;
    }

    .barcode-value {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      word-break: break-word;
      user-select: all;
      text-align: center;
      direction: ltr;
    }

    /* Arabic QR Text specific styling */
    .barcode-value.arabic-text {
      font-family: var(--font-family);
      font-size: 1.05rem;
      line-height: 1.6;
      color: #f1f5f9;
      text-align: right;
      direction: rtl;
      letter-spacing: normal;
      white-space: pre-wrap;
    }

    .barcode-value.placeholder {
      font-size: 0.86rem;
      color: var(--text-dim);
      font-weight: 400;
      letter-spacing: 0;
      font-family: var(--font-family);
      direction: rtl;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:active {
      background: #334155;
    }

    .btn-url {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.35);
      display: none;
    }

    /* Scan History */
    .history-card {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-count {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 999px;
    }

    .history-clear-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.76rem;
      cursor: pointer;
      font-family: inherit;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .history-clear-btn:hover {
      color: #f87171;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding-left: 2px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: #242f49;
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #0d121c;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-sm);
      transition: background 0.15s;
    }
    .history-item:hover {
      background: var(--surface-card-hover);
    }

    .history-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
    }

    .history-value {
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-value.arabic-val {
      font-family: var(--font-family);
      font-size: 0.84rem;
      direction: rtl;
      text-align: right;
    }

    .history-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .history-item-actions {
      display: flex;
      gap: 4px;
      margin-right: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
      padding: 16px 0;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Hidden Canvas & File Input */
    #cropCanvas {
      display: none;
    }
    #fileInput {
      display: none;
    }
  </style>
</head>
<body class="mode-1d">

  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-title-area">
        <h1 id="pageTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/>
          </svg>
          قارئ الباركود و QR الذكي
        </h1>
        <div id="engineBadge" class="engine-badge">
          <span class="status-dot" id="statusDot"></span>
          <span id="engineNameText">جاري فحص المحركات...</span>
        </div>
      </div>
      <div>
        <span id="scanFpsText" style="font-size: 0.72rem; color: var(--text-dim); font-family: monospace;"></span>
      </div>
    </header>

    <!-- Barcode Type Switcher (1D vs QR Code) -->
    <div class="mode-switch-wrapper">
      <button id="btnMode1D" class="mode-btn active" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/>
        </svg>
        <span>باركود 1D (السلع والمنتجات)</span>
      </button>

      <button id="btnModeQR" class="mode-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>كيو آر QR (نصوص وروابط عربية)</span>
      </button>
    </div>

    <!-- HTTPS Warning if insecure -->
    <div id="secureWarning" class="warning-box">
      ⚠️ تنبيه: يتطلب المتصفح تشغيل الصفحة عبر <strong>HTTPS</strong> أو <strong>localhost</strong> للوصول إلى الكاميرا.
    </div>

    <!-- Camera Viewport with Cropping Guide -->
    <div class="camera-wrapper" id="cameraWrapper">
      <video id="cameraVideo" playsinline muted autoplay></video>

      <div class="overlay-mask">
        <div class="mask-top"></div>
        <div class="mask-middle-row">
          <div class="mask-left"></div>
          <div id="scanReticle" class="scan-reticle">
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>
            <div class="laser-line"></div>
          </div>
          <div class="mask-right"></div>
        </div>
        <div class="mask-bottom"></div>
        <div class="scan-hint" id="scanHint">وجّه الخط الأحمر نحو الباركود الأفقي داخل الإطار</div>
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="action-buttons-row">
        <button id="btnToggleCamera" class="btn btn-primary" type="button">
          <svg id="iconCamera" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span id="txtToggleCamera">بدء الكاميرا</span>
        </button>

        <button id="btnToggleTorch" class="btn btn-torch" type="button">

    <!-- History Panel -->
    <div class="history-card">
      <div class="history-header">

  <!-- Offscreen canvas for crop analysis -->
  <canvas id="cropCanvas"></canvas>

  <!-- Toast Notification element -->
  <div id="toast" class="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastText">تمت العملية بنجاح!</span>
  </div>

  <script>
    /**
     * Bulletproof High-Performance Barcode & Arabic QR Code Scanner
     * Hardware accelerated BarcodeDetector + Fully Tested ZXing MultiFormatReader
     * Dual scanning: Fast cropped zone + full-frame fallback
     */

    // Configuration & 1D Formats
    const FORMATS_1D_DETECTOR = [
      'ean_13', 'ean_8', 'upc_a', 'upc_e',
      'code_128', 'code_39', 'code_93', 'itf', 'codabar'
    ];
    const FORMATS_QR_DETECTOR = ['qr_code'];

    const FORMAT_DISPLAY_NAMES = {
      'ean_13': 'EAN-13',
      'ean_8': 'EAN-8',
      'upc_a': 'UPC-A',
      'upc_e': 'UPC-E',
      'code_128': 'Code 128',
      'code_39': 'Code 39',
      'code_93': 'Code 93',
      'itf': 'ITF',
      'codabar': 'Codabar',
      'qr_code': 'QR Code (عربي)',
      'EAN_13': 'EAN-13',
      'EAN_8': 'EAN-8',
      'UPC_A': 'UPC-A',
      'UPC_E': 'UPC-E',
      'CODE_128': 'Code 128',
      'CODE_39': 'Code 39',
      'CODE_93': 'Code 93',
      'ITF': 'ITF',
      'CODABAR': 'Codabar',
      'QR_CODE': 'QR Code (عربي)'
    };

    // DOM Elements
    const elements = {
      body: document.body,
      video: document.getElementById('cameraVideo'),
      scanReticle: document.getElementById('scanReticle'),
      scanHint: document.getElementById('scanHint'),
      engineBadge: document.getElementById('engineBadge'),
      statusDot: document.getElementById('statusDot'),
      engineNameText: document.getElementById('engineNameText'),
      scanFpsText: document.getElementById('scanFpsText'),
      secureWarning: document.getElementById('secureWarning'),
      btnMode1D: document.getElementById('btnMode1D'),
      btnModeQR: document.getElementById('btnModeQR'),
      btnToggleCamera: document.getElementById('btnToggleCamera'),
      txtToggleCamera: document.getElementById('txtToggleCamera'),
      btnToggleTorch: document.getElementById('btnToggleTorch'),
      txtToggleTorch: document.getElementById('txtToggleTorch'),
      btnUploadImage: document.getElementById('btnUploadImage'),
      fileInput: document.getElementById('fileInput'),
      zoomDisplay: document.getElementById('zoomDisplay'),
      zoomChips: document.querySelectorAll('.zoom-chip-btn'),
      btnCycleZoom: document.getElementById('btnCycleZoom'),
      currentBarcode: document.getElementById('currentBarcode'),
      currentFormat: document.getElementById('currentFormat'),
      btnCopyBarcode: document.getElementById('btnCopyBarcode'),
      btnSearchBarcode: document.getElementById('btnSearchBarcode'),
      btnOpenUrl: document.getElementById('btnOpenUrl'),
      historyList: document.getElementById('historyList'),
      historyCount: document.getElementById('historyCount'),
      btnClearHistory: document.getElementById('btnClearHistory'),
      toast: document.getElementById('toast'),
      toastText: document.getElementById('toastText'),
      cropCanvas: document.getElementById('cropCanvas')
    };

    const cropCtx = elements.cropCanvas.getContext('2d', { willReadFrequently: true });

    // Application State
    let currentMode = '1d'; // '1d' | 'qr'
    let mediaStream = null;
    let videoTrack = null;
    let trackCapabilities = {};
    let isCameraRunning = false;
    let isScanning = false;
    let scanLoopTimer = null;
    let frameCycleCounter = 0;
    let scanGeneration = 0;
    let scanBusy = false;
    let engineGeneration = 0;
    let cameraStarting = false;
    let cameraGeneration = 0;
    let digitalZoom = 1;
    let lastVideoTime = -1;
    const fullCanvas = document.createElement('canvas');
    const fullCtx = fullCanvas.getContext('2d', { willReadFrequently: true });

    // Zoom State
    let currentZoom = 1.0;
    const ZOOM_PRESETS = [1.0, 1.5, 2.0, 3.0];
    let isHardwareZoomSupported = false;

    // Torch State
    let isTorchOn = false;

    // Scanning Engine Instances
    let nativeDetector = null;
    let zxingMultiFormatReader = null;
    let zxingHardReader = null;
    let activeEngineName = 'جاري التهيئة...';

    // Duplicate prevention
    let lastScannedValue = '';
    let lastScannedAt = 0;
    const DUPLICATE_INTERVAL_MS = 1500;

    // Web Audio API
    let audioCtx = null;

    // History Storage
    const STORAGE_KEY = 'barcode_scanner_history_v3';
    let scanHistory = [];

    // Page Lifecycle
    window.addEventListener('DOMContentLoaded', async () => {
      checkSecureContext();
      loadHistory();
      setupEventListeners();
      await initializeEngines();

      // Launch camera
      startCamera();
    });

    function checkSecureContext() {
      if (!window.isSecureContext && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        elements.secureWarning.style.display = 'block';
      }
    }

    // 1. Dual Engine Setup (BarcodeDetector + MultiFormatReader)
    async function initializeEngines() {
      const generation = ++engineGeneration;
      nativeDetector = null;
      let nativeAvailable = false;

      // Check Native BarcodeDetector
      if ('BarcodeDetector' in window) {
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          if (generation !== engineGeneration) return;
          const wanted = currentMode === '1d' ? FORMATS_1D_DETECTOR : FORMATS_QR_DETECTOR;
          const usable = wanted.filter(f => supported.includes(f));

          if (usable.length > 0) {
            nativeDetector = new BarcodeDetector({ formats: usable });
            nativeAvailable = true;
          }
        } catch (e) {
          console.warn('BarcodeDetector format check notice:', e);
        }
      }

      // Initialize ZXing MultiFormatReader
      setupZXingEngines();

      // Update badge
      if (nativeAvailable) {
        activeEngineName = 'Native (محرك المتصفح فائق السرعة)';
        elements.engineBadge.className = 'engine-badge native';
      } else if (zxingMultiFormatReader) {
        activeEngineName = 'ZXing (محرك شامل متوافق مع كافة الأجهزة)';
        elements.engineBadge.className = 'engine-badge zxing';
      } else {
        activeEngineName = 'تعذر تحميل محرك القراءة؛ أعد تحميل الصفحة';
        elements.engineBadge.className = 'engine-badge zxing';
      }
      elements.engineNameText.textContent = activeEngineName;
    }

    function setupZXingEngines() {
      if (typeof ZXing === 'undefined') {
        console.warn('ZXing library unavailable.');
        return;
      }

      try {
        const hints = new Map();
        const formats = [];

        if (currentMode === '1d') {
          formats.push(
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.EAN_8,
            ZXing.BarcodeFormat.UPC_A,
            ZXing.BarcodeFormat.UPC_E,
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.CODE_39,
            ZXing.BarcodeFormat.CODE_93,
            ZXing.BarcodeFormat.ITF,
            ZXing.BarcodeFormat.CODABAR
          );
        } else {
          formats.push(ZXing.BarcodeFormat.QR_CODE);
        }

        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        // Reserve exhaustive search for periodic fallback frames.
        hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'UTF-8');

        // Synchronous frame-by-frame MultiFormatReader
        zxingMultiFormatReader = new ZXing.MultiFormatReader();
        zxingMultiFormatReader.setHints(hints);

        const hardHints = new Map(hints);
        hardHints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        zxingHardReader = new ZXing.MultiFormatReader();
        zxingHardReader.setHints(hardHints);
      } catch (err) {
        console.error('ZXing engine init error:', err);
      }
    }

    // 2. Switching Modes (1D vs QR Code)
    async function switchMode(mode) {
      if (currentMode === mode) return;
      stopScanCycle();
      currentMode = mode;

      if (mode === '1d') {
        elements.body.classList.remove('mode-qr');
        elements.body.classList.add('mode-1d');
        elements.btnMode1D.classList.add('active');
        elements.btnModeQR.classList.remove('active');
        elements.scanHint.textContent = 'وجّه الخط الأحمر نحو الباركود الأفقي داخل الإطار';
      } else {
        elements.body.classList.remove('mode-1d');
        elements.body.classList.add('mode-qr');
        elements.btnModeQR.classList.add('active');
        elements.btnMode1D.classList.remove('active');
        elements.scanHint.textContent = 'وجّه المربع نحو رمز QR (يدعم النصوص والروابط العربية)';
      }

      await initializeEngines();
      if (isCameraRunning) startScanCycle();
      showToast(mode === '1d' ? 'نمط باركود 1D للمنتجات' : 'نمط كيو آر QR (نصوص وروابط)');
    }

    // 3. Camera Management
    async function startCamera() {
      if (isCameraRunning || cameraStarting) return;
      cameraStarting = true;
      const generation = ++cameraGeneration;

      const idealConstraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30, max: 30 }
        },
        audio: false
      };

      try {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia(idealConstraints);
        } catch (firstErr) {
          console.warn('Ideal constraints failed, attempting fallback camera constraints...', firstErr);
          // Fallback for laptops/webcams or strict mobile browsers
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          }).catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
        }

        if (generation !== cameraGeneration || document.hidden) {
          mediaStream.getTracks().forEach(t => t.stop());
          mediaStream = null;
          return;
        }
        elements.video.srcObject = mediaStream;
        await elements.video.play();
        if (generation !== cameraGeneration) return;

        videoTrack = mediaStream.getVideoTracks()[0];
        isCameraRunning = true;
        updateCameraButtonUI(true);

        // Read hardware capabilities (torch, zoom, autofocus)
        inspectCapabilities();

        // Start scanning cycle
        if (elements.video.readyState >= 2) {
          startScanCycle();
        } else {
          elements.video.onloadedmetadata = () => {
            startScanCycle();
          };
        }
      } catch (err) {
        console.error('Camera open failed:', err);
        stopCamera();
        updateCameraButtonUI(false);
        showToast('تعذر فتح الكاميرا. يرجى التحقق من أذونات الكاميرا.');
      } finally {
        cameraStarting = false;
      }
    }

    function stopCamera() {
      cameraGeneration++;
      elements.video.onloadedmetadata = null;
      stopScanCycle();

      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      videoTrack = null;
      isCameraRunning = false;
      elements.video.srcObject = null;

      // Reset torch & zoom
      isTorchOn = false;
      elements.btnToggleTorch.classList.remove('active');
      elements.txtToggleTorch.textContent = 'تفعيل الفلاش';
      applyZoom(1.0);

      updateCameraButtonUI(false);
      elements.statusDot.classList.remove('active-scan');
      elements.scanFpsText.textContent = '';
    }

    function updateCameraButtonUI(running) {
      if (running) {
        elements.btnToggleCamera.classList.remove('btn-primary');
        elements.btnToggleCamera.classList.add('btn-stop');
        elements.txtToggleCamera.textContent = 'إيقاف الكاميرا';
        elements.statusDot.classList.add('active-scan');
      } else {
        elements.btnToggleCamera.classList.remove('btn-stop');
        elements.btnToggleCamera.classList.add('btn-primary');
        elements.txtToggleCamera.textContent = 'تشغيل الكاميرا';
        elements.statusDot.classList.remove('active-scan');
      }
    }

    // 4. Hardware Controls: Autofocus, Torch, Zoom
    async function inspectCapabilities() {
      if (!videoTrack) return;

      try {
        trackCapabilities = videoTrack.getCapabilities?.() || {};

        // Continuous Autofocus
        if (trackCapabilities.focusMode && Array.isArray(trackCapabilities.focusMode)) {
          if (trackCapabilities.focusMode.includes('continuous')) {
            try {
              await videoTrack.applyConstraints({
                advanced: [{ focusMode: 'continuous' }]
              });
            } catch (e) {}
          }
        }

        // Hardware Zoom
        isHardwareZoomSupported = !!trackCapabilities.zoom;

        // Apply current zoom
        applyZoom(currentZoom);
      } catch (err) {
        console.warn('Inspect capabilities note:', err);
      }
    }

    async function toggleTorch() {
      if (!videoTrack) {
        showToast('يرجى تشغيل الكاميرا أولاً لتفعيل الفلاش');
        return;
      }

      const targetState = !isTorchOn;

      try {
        await videoTrack.applyConstraints({
          advanced: [{ torch: targetState }]
        });

        isTorchOn = targetState;

        if (isTorchOn) {
          elements.btnToggleTorch.classList.add('active');
          elements.txtToggleTorch.textContent = 'إطفاء الفلاش';
          showToast('تم تشغيل الفلاش');
        } else {
          elements.btnToggleTorch.classList.remove('active');
          elements.txtToggleTorch.textContent = 'تفعيل الفلاش';
          showToast('تم إطفاء الفلاش');
        }
      } catch (err) {
        console.warn('Torch activation failed:', err);
        showToast('الفلاش غير مدعوم في كاميرا هذا الجهاز');
      }
    }

    async function applyZoom(zoomFactor) {
      currentZoom = parseFloat(zoomFactor);
      elements.zoomDisplay.textContent = `تكبير: ${currentZoom.toFixed(1)}x`;

      elements.zoomChips.forEach(chip => {
        const val = parseFloat(chip.getAttribute('data-zoom'));
        if (Math.abs(val - currentZoom) < 0.05) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });

      // Try hardware optical zoom
      if (videoTrack && isHardwareZoomSupported && trackCapabilities.zoom) {
        try {
          const min = trackCapabilities.zoom.min || 1;
          const max = trackCapabilities.zoom.max || 5;
          const clamped = Math.min(Math.max(currentZoom, min), max);
          await videoTrack.applyConstraints({
            advanced: [{ zoom: clamped }]
          });
          digitalZoom = 1;
          elements.video.style.transform = 'scale(1)';
          return;
        } catch (e) {}
      }

      // Digital zoom fallback (works on all devices)
      digitalZoom = currentZoom;
      elements.video.style.transform = `scale(${currentZoom})`;
    }

    function cycleZoom() {
      let currentIndex = ZOOM_PRESETS.findIndex(z => Math.abs(z - currentZoom) < 0.05);
      if (currentIndex === -1) currentIndex = 0;
      const nextIndex = (currentIndex + 1) % ZOOM_PRESETS.length;
      applyZoom(ZOOM_PRESETS[nextIndex]);
    }

    // Single-flight scanning: bounded synchronous fallback, no continuous decoder.
    function startScanCycle() {
      if (isScanning) return;
      isScanning = true;
      frameCycleCounter = 0;
      lastVideoTime = -1;
      scanStep(++scanGeneration);
    }

    function stopScanCycle() {
      isScanning = false;
      scanGeneration++;
      clearTimeout(scanLoopTimer);
      scanLoopTimer = null;
    }

    function drawScanFrame(full = false, detailed = false) {
      const vw = elements.video.videoWidth, vh = elements.video.videoHeight;
      let sw = vw, sh = vh;
      if (!full) {
        // Account for object-fit: cover and the visible guide's actual geometry.
        const box = elements.video.getBoundingClientRect();
        const guide = elements.scanReticle.getBoundingClientRect();
        const scale = Math.max(box.width / vw, box.height / vh);
        sw = Math.min(vw, guide.width / scale);
        sh = Math.min(vh, guide.height / scale);
      }
      const canvas = full ? fullCanvas : elements.cropCanvas;
      const ctx = full ? fullCtx : cropCtx;
      const ratio = Math.min(1, (detailed ? 1280 : 960) / Math.max(sw, sh));
      const width = Math.max(1, Math.round(sw * ratio));
      const height = Math.max(1, Math.round(sh * ratio));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
      ctx.drawImage(elements.video, (vw-sw)/2, (vh-sh)/2, sw, sh, 0, 0, width, height);
      return canvas;
    }

    function decodeCanvas(canvas, reader) {
      try {
        const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
        const result = reader.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source)));
        const format = ZXing.BarcodeFormat[result.getBarcodeFormat()];
        return { value: decodeArabicUtf8(result.getText()), format: FORMAT_DISPLAY_NAMES[format] || format };
      } catch (error) {
        return null;
      } finally {
        reader.reset();
      }
    }

    async function scanStep(generation) {
      if (!isScanning || generation !== scanGeneration) return;
      const started = performance.now();
      let ownsScan = false;
      const valid = () => isScanning && isCameraRunning && generation === scanGeneration;
      try {
        if (scanBusy || !isCameraRunning || elements.video.paused || elements.video.ended ||
            elements.video.readyState < 2 || !elements.video.videoWidth ||
            elements.video.currentTime === lastVideoTime) return;
        scanBusy = ownsScan = true;
        lastVideoTime = elements.video.currentTime;
        frameCycleCounter++;
        const detailed = frameCycleCounter % 10 === 0;
        const full = frameCycleCounter % 5 === 0;
        const canvas = drawScanFrame(full, detailed);
        let result = null;
        if (nativeDetector) {
          try {
            const found = await nativeDetector.detect(canvas);
            if (!valid()) return;
            if (found.length) result = { value: found[0].rawValue,
              format: FORMAT_DISPLAY_NAMES[found[0].format] || found[0].format };
          } catch (error) { /* Periodic ZXing fallback remains available. */ }
        }
        if (!valid()) return;
        if (!result && zxingMultiFormatReader && (!nativeDetector || frameCycleCounter % 4 === 0 || detailed)) {
          result = decodeCanvas(canvas, detailed ? zxingHardReader : zxingMultiFormatReader);
        }
        if (result && valid()) handleBarcodeDetection(result.value, result.format);
      } catch (error) {
        console.warn('Frame skipped:', error);
      } finally {
        if (ownsScan) scanBusy = false;
        if (valid()) {
          const elapsed = performance.now() - started;
          scanLoopTimer = setTimeout(() => scanStep(generation), Math.max(35, 100 - elapsed));
        }
      }
    }

    // 6. Decode from Image File (Upload from Gallery)
    async function decodeFromImageFile(file) {
      if (!file) return;

      showToast('جاري تحليل الصورة...');
      const img = new Image();
      const reader = new FileReader();

      reader.onload = (e) => {
        img.onload = async () => {
          let detectedText = null;
          let detectedFormat = null;

          // 1. Try Native BarcodeDetector
          if ('BarcodeDetector' in window) {
            try {
              const allFormats = [...FORMATS_1D_DETECTOR, ...FORMATS_QR_DETECTOR];
              const detector = new BarcodeDetector({ formats: allFormats });
              const results = await detector.detect(img);
              if (results && results.length > 0) {
                detectedText = results[0].rawValue;
                detectedFormat = FORMAT_DISPLAY_NAMES[results[0].format] || results[0].format;
              }
            } catch (err) {}
          }

          // 2. Try ZXing
          if (!detectedText && typeof ZXing !== 'undefined') {
            try {
              // Draw image to canvas
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = img.naturalWidth || img.width;
              tempCanvas.height = img.naturalHeight || img.height;
              const ctx = tempCanvas.getContext('2d');
              ctx.drawImage(img, 0, 0);

              const lum = new ZXing.HTMLCanvasElementLuminanceSource(tempCanvas);
              const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));

              const hints = new Map();
              hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,
                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E,
                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39,
                ZXing.BarcodeFormat.CODE_93,
                ZXing.BarcodeFormat.ITF,
                ZXing.BarcodeFormat.CODABAR,
                ZXing.BarcodeFormat.QR_CODE
              ]);
              hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

              const multiReader = new ZXing.MultiFormatReader();
              multiReader.setHints(hints);
              const zResult = multiReader.decodeWithState(bitmap);

              if (zResult) {
                detectedText = decodeArabicUtf8(zResult.getText(), zResult.getRawBytes());
                detectedFormat = FORMAT_DISPLAY_NAMES[ZXing.BarcodeFormat[zResult.getBarcodeFormat()]] || 'Barcode';
              }
            } catch (zErr) {
              console.warn('ZXing image decode error:', zErr);
            }
          }

          if (detectedText) {
            handleBarcodeDetection(detectedText, detectedFormat);
            showToast('تمت قراءة الباركود بنجاح من الصورة!');
          } else {
            showToast('لم يتم العثور على باركود واضح في الصورة المختارة');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 7. Safe Arabic & UTF-8 Text Decoder
    function decodeArabicUtf8(text, rawBytes) {
      if (!text) return '';

      if ([...text].some(c => c.charCodeAt(0) > 255)) return text;

      // Fix Latin-1 to UTF-8 mojibake
      try {
        const bytes = new Uint8Array([...text].map(c => c.charCodeAt(0) & 0xff));
        const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        if (decoded && /[\u0600-\u06FF]/.test(decoded)) {
          return decoded;
        }
      } catch (e) {}

      return text;
    }

    function containsArabic(str) {
      return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(str);
    }

    function isWebUrl(str) {
      try {
        const url = new URL(str);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (e) {
        return false;
      }
    }

    // 8. Result Handling & Feedback
    function handleBarcodeDetection(rawValue, format) {
      if (!rawValue) return;

      const trimmed = String(rawValue).trim();
      const now = Date.now();

      // Debounce identical scans within 1.5 seconds
      if (trimmed === lastScannedValue && (now - lastScannedAt) < DUPLICATE_INTERVAL_MS) {
        return;
      }

      lastScannedValue = trimmed;
      lastScannedAt = now;

      // Visual flash
      triggerVisualFlash();

      // Audio Beep
      playBeep();

      // Physical vibration
      triggerVibration();

      // Update Display UI
      elements.currentBarcode.textContent = trimmed;
      elements.currentBarcode.classList.remove('placeholder');
      elements.currentFormat.textContent = String(format).toUpperCase();

      // Typography for Arabic or Monospace
      if (containsArabic(trimmed)) {
        elements.currentBarcode.classList.add('arabic-text');
      } else {
        elements.currentBarcode.classList.remove('arabic-text');
      }

      // Check URL for direct link opening
      if (isWebUrl(trimmed)) {
        elements.btnOpenUrl.style.display = 'inline-flex';
        elements.btnOpenUrl.onclick = () => window.open(trimmed, '_blank');
      } else {
        elements.btnOpenUrl.style.display = 'none';
      }

      // Add to History
      addHistoryItem(trimmed, format);
    }

    function triggerVisualFlash() {
      elements.scanReticle.classList.add('success-flash');
      setTimeout(() => {
        elements.scanReticle.classList.remove('success-flash');
      }, 260);
    }

    function playBeep() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }

        if (!audioCtx) return;

        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createGain ? audioCtx.createOscillator() : null;
        const gain = audioCtx.createGain ? audioCtx.createGain() : null;

        if (osc && gain) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(currentMode === 'qr' ? 1200 : 1050, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.09);
        }
      } catch (e) {}
    }

    function triggerVibration() {
      if (navigator.vibrate) {
        try {
          navigator.vibrate([70, 35, 70]);
        } catch (e) {}
      }
    }

    // 9. History Management
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          scanHistory = Array.isArray(parsed) ? parsed.filter(item => item && typeof item.value === 'string').slice(0, 30) : [];
        }
      } catch (e) {
        scanHistory = [];
      }
      renderHistoryUI();
    }

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(scanHistory));
      } catch (e) {}
    }

    function addHistoryItem(value, format) {
      const item = {
        id: Date.now() + Math.random().toString(36).substring(2, 5),
        value: value,
        format: format,
        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      };

      scanHistory.unshift(item);
      if (scanHistory.length > 30) {
        scanHistory = scanHistory.slice(0, 30);
      }

      saveHistory();
      renderHistoryUI();
    }

    function renderHistoryUI() {
      elements.historyCount.textContent = scanHistory.length;

      if (scanHistory.length === 0) {
        elements.historyList.innerHTML = '<div class="empty-history-msg">لا توجد قراءات سابقة</div>';
        return;
      }

      elements.historyList.innerHTML = '';
      scanHistory.forEach(item => {
        const isAr = containsArabic(item.value);
        const el = document.createElement('div');
        el.className = 'history-item';
        el.innerHTML = `
          <div class="history-meta">
            <span class="history-value ${isAr ? 'arabic-val' : ''}">${escapeHtml(item.value)}</span>
            <div class="history-sub">
              <span>${escapeHtml(item.format)}</span>
              <span>•</span>
              <span>${escapeHtml(item.time)}</span>
            </div>
          </div>
          <div class="history-item-actions">
            <button class="icon-btn" title="نسخ" data-copy="${escapeHtml(item.value)}" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="icon-btn" title="بحث" data-search="${escapeHtml(item.value)}" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
        `;
        elements.historyList.appendChild(el);
      });
    }

    function clearHistory() {
      if (scanHistory.length === 0) return;
      if (confirm('هل تريد مسح جميع سجلات القراءات؟')) {
        scanHistory = [];
        saveHistory();
        renderHistoryUI();
        showToast('تم مسح السجل');
      }
    }

    // 10. Event Listeners Setup
    function setupEventListeners() {
      elements.btnMode1D.addEventListener('click', () => switchMode('1d'));
      elements.btnModeQR.addEventListener('click', () => switchMode('qr'));

      elements.btnToggleCamera.addEventListener('click', () => {
        if (isCameraRunning) {
          stopCamera();
        } else {
          startCamera();
        }
      });

      elements.btnToggleTorch.addEventListener('click', toggleTorch);

      // Upload from image button
      elements.btnUploadImage.addEventListener('click', () => {
        elements.fileInput.click();
      });

      elements.fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          decodeFromImageFile(e.target.files[0]);
        }
      });

      // Zoom presets
      elements.zoomChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const val = chip.getAttribute('data-zoom');
          applyZoom(val);
        });
      });

      elements.btnCycleZoom.addEventListener('click', cycleZoom);

      // Copy Main Barcode
      elements.btnCopyBarcode.addEventListener('click', () => {
        const text = elements.currentBarcode.textContent;
        if (!text || elements.currentBarcode.classList.contains('placeholder')) {
          showToast('لا يوجد محتوى لنسخه');
          return;
        }
        copyToClipboard(text);
      });

      // Search Main Barcode
      elements.btnSearchBarcode.addEventListener('click', () => {
        const text = elements.currentBarcode.textContent;
        if (!text || elements.currentBarcode.classList.contains('placeholder')) {
          showToast('لا يوجد محتوى للبحث عنه');
          return;
        }
        window.open(`https://www.google.com/search?q=${encodeURIComponent(text)}`, '_blank');
      });

      // Clear History
      elements.btnClearHistory.addEventListener('click', clearHistory);

      // Delegated history list click
      elements.historyList.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          copyToClipboard(copyBtn.getAttribute('data-copy'));
          return;
        }

        const searchBtn = e.target.closest('[data-search]');
        if (searchBtn) {
          const val = searchBtn.getAttribute('data-search');
          window.open(`https://www.google.com/search?q=${encodeURIComponent(val)}`, '_blank');
        }
      });

      // Visibility Change: Auto-stop camera when tab is minimized
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (isCameraRunning) {
            stopCamera();
          }
        }
      });
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
        showToast(`تم نسخ: ${text.length > 25 ? text.substring(0, 25) + '...' : text}`);
      } catch (err) {
        showToast('تعذر النسخ إلى الحافظة');
      }
    }

    let toastTimeout = null;
    function showToast(message) {
      elements.toastText.textContent = message;
      elements.toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        elements.toast.classList.remove('show');
      }, 2400);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
